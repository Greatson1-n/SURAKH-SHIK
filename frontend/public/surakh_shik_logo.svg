<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f223d"/>
      <stop offset="100%" stop-color="#061120"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2648"/>
      <stop offset="100%" stop-color="#040a14"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <!-- Circular Text Paths -->
    <path id="topTextArc" d="M 80 256 A 176 176 0 1 1 432 256" fill="none"/>
    <path id="bottomTextArc" d="M 432 256 A 176 176 0 1 1 80 256" fill="none"/>
  </defs>

  <!-- Outer Background Seal Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#ringGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Circular Text: SURAKH-SHIK & SURAKSHA-SAKSHYA -->
  <text fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="9">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SURAKH - SHIK
    </textPath>
  </text>

  <text fill="#93c5fd" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-weight="800" font-size="26" letter-spacing="6">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      सुरक्षा - साक्ष्य
    </textPath>
  </text>

  <!-- Stars on Ring Sides -->
  <polygon points="68,256 73,267 85,268 76,276 79,288 68,281 57,288 60,276 51,268 63,267" fill="url(#goldGrad)"/>
  <polygon points="444,256 449,267 461,268 452,276 455,288 444,281 433,288 436,276 427,268 439,267" fill="url(#goldGrad)"/>

  <!-- Central Emblem: Sovereign Security Shield -->
  <!-- Shield Outline and Body -->
  <path d="M 256 96 
           C 336 96, 368 116, 384 148
           C 384 250, 344 340, 256 394
           C 168 340, 128 250, 128 148
           C 144 116, 176 96, 256 96 Z"
        fill="url(#shieldGrad)"
        stroke="url(#goldGrad)"
        stroke-width="7"
        filter="url(#goldGlow)"/>

  <!-- Inner Shield Inset Border -->
  <path d="M 256 114 
           C 324 114, 352 132, 366 158
           C 366 246, 332 324, 256 372
           C 180 324, 146 246, 146 158
           C 160 132, 188 114, 256 114 Z"
        fill="none"
        stroke="rgba(56, 189, 248, 0.5)"
        stroke-width="2"/>

  <!-- Upper Center: Ashok Chakra (24 Spokes of Truth & Law) -->
  <g transform="translate(256, 194)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- 24 Spokes -->
    <!-- 12 diametrical lines representing all 24 spokes -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <line x1="-29.7" y1="-29.7" x2="29.7" y2="29.7" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <line x1="-29.7" y1="29.7" x2="29.7" y2="-29.7" stroke="url(#goldGrad)" stroke-width="2.2"/>

    <line x1="-15.4" y1="-38.8" x2="15.4" y2="38.8" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="15.4" y1="-38.8" x2="-15.4" y2="38.8" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="-38.8" y1="-15.4" x2="38.8" y2="15.4" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="38.8" y1="-15.4" x2="-38.8" y2="15.4" stroke="url(#goldGrad)" stroke-width="1.8"/>

    <line x1="-35.7" y1="-21.8" x2="35.7" y2="21.8" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="35.7" y1="-21.8" x2="-35.7" y2="21.8" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="-21.8" y1="-35.7" x2="21.8" y2="35.7" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="21.8" y1="-35.7" x2="-21.8" y2="35.7" stroke="url(#goldGrad)" stroke-width="1.8"/>
  </g>

  <!-- Blockchain Hash Circuit & Key Nodes -->
  <g stroke="url(#cyanGrad)" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- Connecting circuit lines -->
    <path d="M 200 286 L 256 256 L 312 286"/>
    <path d="M 200 286 L 200 326 L 256 356 L 312 326 L 312 286"/>
    <path d="M 256 256 L 256 356"/>

    <!-- Left & Right Ingestion Bus -->
    <path d="M 166 220 L 194 240 L 194 278"/>
    <path d="M 346 220 L 318 240 L 318 278"/>
  </g>

  <!-- Blockchain Nodes -->
  <circle cx="200" cy="286" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="312" cy="286" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="200" cy="326" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="312" cy="326" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="256" cy="356" r="6" fill="#f59e0b" filter="url(#goldGlow)"/>
  <circle cx="166" cy="220" r="4" fill="#38bdf8"/>
  <circle cx="346" cy="220" r="4" fill="#38bdf8"/>

  <!-- High-Security Padlock at Center -->
  <g transform="translate(256, 306)" filter="url(#goldGlow)">
    <!-- Shackle -->
    <path d="M -16 -6 A 16 16 0 0 1 16 -6 L 16 6 L -16 6 Z"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="6"
          stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="-24" y="6" width="48" height="36" rx="6" fill="url(#goldGrad)"/>
    <!-- Keyhole -->
    <circle cx="0" cy="20" r="4.5" fill="#0b192c"/>
    <polygon points="-2.5,22 2.5,22 4,32 -4,32" fill="#0b192c"/>
  </g>
</svg>
